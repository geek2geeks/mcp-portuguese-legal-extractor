name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  verify:
    name: Verify on Windows (self-hosted)
    runs-on: [self-hosted, Windows, X64, mcp-portuguese-legal-extractor]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements.txt
          python -m pip install --disable-pip-version-check flake8==6.1.0

      - name: Syntax check
        run: python -m compileall -q production_extractor.py clean_ground_truth.py run_test1.py

      - name: Lint (critical errors only)
        run: python -m flake8 --jobs=1 --select=E9,F63,F7,F82 --statistics production_extractor.py clean_ground_truth.py run_test1.py

      - name: Import smoke test
        run: python -c "import production_extractor; print('import ok')"

      - name: CLI smoke test
        run: python production_extractor.py --help

      - name: UTF-8 stdout guard (Windows)
        run: python -c "print('unicode-stdout-ok', chr(0x2713))"
